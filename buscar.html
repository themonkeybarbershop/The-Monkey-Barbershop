<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscar - Spotify</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="container">
    <div class="header">
        <div class="profile-icon">D</div>
        <h1 class="header-title">Buscar</h1>
    </div>
    <div class="search-container">
        <div class="search-box">
            <span class="material-icons">search</span>
            <input type="text" class="search-input" placeholder="¿Qué quieres escuchar?">
        </div>
    </div>
    <section>
        <h2 class="section-title">Explorar todo</h2>
        <div class="categories-grid" id="categoriesGrid"></div>
    </section>
</div>
<nav class="bottom-nav">
    <div class="nav-item" onclick="window.location.href='index.html'">
        <span class="material-icons">home</span>
        <span>Inicio</span>
    </div>
    <div class="nav-item active" onclick="window.location.href='buscar.html'">
        <span class="material-icons">search</span>
        <span>Buscar</span>
    </div>
    <div class="nav-item">
        <span class="material-icons">library_music</span>
        <span>Tu biblioteca</span>
    </div>
    <div class="nav-item">
        <span class="material-icons">add_circle_outline</span>
        <span>Crear</span>
    </div>
</nav>
<script>
const genres = [
    { name: 'Música', color: 'pink' },
    { name: 'Podcasts', color: 'green' },
    { name: 'Eventos en vivo', color: 'purple' },
    { name: 'El 2025 en música', color: 'yellow' },
    { name: 'Pop', color: 'blue' },
    { name: 'Rock', color: 'red' },
    { name: 'Hip-Hop', color: 'orange' },
    { name: 'Latina', color: 'teal' },
    { name: 'Electrónica', color: 'purple' },
    { name: 'R&B', color: 'pink' },
    { name: 'Country', color: 'yellow' },
    { name: 'Jazz', color: 'blue' },
    { name: 'Clásica', color: 'purple' },
    { name: 'Reggae', color: 'green' },
    { name: 'Metal', color: 'red' },
    { name: 'Blues', color: 'blue' },
    { name: 'Folk', color: 'orange' },
    { name: 'Soul', color: 'pink' },
    { name: 'Funk', color: 'purple' },
    { name: 'Reggaeton', color: 'teal' },
    { name: 'Indie', color: 'yellow' },
    { name: 'Alternative', color: 'green' },
    { name: 'Dance', color: 'blue' },
    { name: 'K-Pop', color: 'pink' },
    { name: 'Gospel', color: 'purple' },
    { name: 'Punk', color: 'red' }
];
async function fetchMusicData() {
    const response = await fetch('https://itunes.apple.com/mx/rss/topsongs/limit=200/json');
    const data = await response.json();
    if (!data.feed?.entry) return;
    const normalized = data.feed.entry.map(item => ({
        artwork: item['im:image'][2].label.replace(/100x100bb\.jpg$/, '3000x3000bb.jpg').replace(/\d+x\d+bb\.jpg$/, '3000x3000bb.jpg')
    }));
    displayCategories(normalized);
}
function displayCategories(musicData) {
    const container = document.getElementById('categoriesGrid');
    container.innerHTML = '';
    genres.forEach((genre) => {
        const card = document.createElement('div');
        card.className = `category-card category-card-${genre.color}`;
        const randomTrack = musicData[Math.floor(Math.random() * musicData.length)];
        card.innerHTML = `
            <div class="category-card-content">
                <div class="category-title">${genre.name}</div>
            </div>
            <img class="category-image" src="${randomTrack.artwork}" alt="${genre.name}">
        `;
        container.appendChild(card);
    });
}
fetchMusicData();
</script>
</body>
</html>
