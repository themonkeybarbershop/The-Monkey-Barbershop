<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link href="
https://cdn.jsdelivr.net/npm/@vetixy/circular-std@1.0.0/dist/index.min.css" rel="stylesheet">
</head>
<body>
    <div class="page active" id="home">
        <div class="container">
            <nav class="nav-pills" id="navPills">
                <div class="profile-icon">S</div>
            </nav>
            <p class="subtitle">Explora una sesión basada en tus gustos musicales</p>
            <div class="section" id="sectionsContainer"></div>
        </div>
    </div>

    <div class="page" id="search">
        <div class="container">
            <div class="header">
                <div class="profile-icon">S</div>
                <h1 class="main-title">Buscar</h1>
            </div>
            <div class="search-box">
                <span class="material-icons">search</span>
                <span class="search-placeholder">¿Qué quieres escuchar?</span>
            </div>
        </div>
    </div>

    <div class="page" id="playlistView">
        <div class="playlist-gradient"></div>
        <div class="now-playing-header">
            <button class="icon-btn" onclick="closePlaylistView()">
                <span class="material-icons">arrow_back</span>
            </button>
        </div>
        <div class="now-playing-content">
            <div class="now-playing-cover" id="plCover"></div>
            <div class="now-playing-info">
                <div class="now-playing-title" id="plTitle"></div>
                <div class="now-playing-artist" id="plArtist"></div>
            </div>
            <div class="now-playing-controls">
                <button class="icon-btn"><span class="material-icons">shuffle</span></button>
                <button class="icon-btn"><span class="material-icons">skip_previous</span></button>
                <button class="play-btn-large" id="playBtnLarge"><span class="material-icons">pause</span></button>
                <button class="icon-btn"><span class="material-icons">skip_next</span></button>
                <button class="icon-btn"><span class="material-icons">repeat</span></button>
            </div>
            <div class="songs-list" id="playlistSongs"></div>
        </div>
    </div>

    <div class="page" id="nowPlaying">
        <div class="now-playing-header">
            <button class="icon-btn" onclick="closeNowPlaying()"><span class="material-icons">expand_more</span></button>
            <button class="icon-btn"><span class="material-icons">more_horiz</span></button>
        </div>
        <div class="now-playing-content">
            <div class="now-playing-cover" id="npCover"></div>
            <div class="now-playing-info">
                <div class="now-playing-title" id="npTitle"></div>
                <div class="now-playing-artist" id="npArtist"></div>
            </div>
            <div class="now-playing-progress">
                <input type="range" class="progress-bar" id="progressBar" min="0" max="100" value="0">
                <div class="progress-time">
                    <span id="currentTime">0:00</span>
                    <span id="totalTime">0:00</span>
                </div>
            </div>
            <div class="now-playing-controls">
                <button class="icon-btn"><span class="material-icons">shuffle</span></button>
                <button class="icon-btn"><span class="material-icons">skip_previous</span></button>
                <button class="play-btn-large" id="playBtnLarge2"><span class="material-icons">pause</span></button>
                <button class="icon-btn"><span class="material-icons">skip_next</span></button>
                <button class="icon-btn"><span class="material-icons">repeat</span></button>
            </div>
        </div>
    </div>

    <div class="player-bar-spacing" id="playerBarSpacing"></div>
    
    <div class="player-bar" id="playerBar">
        <div class="player-cover" id="playerCover"></div>
        <div class="player-info">
            <div class="player-title" id="playerTitle"></div>
            <div class="player-artist" id="playerArtist"></div>
        </div>
        <div class="player-controls">
            <button class="player-btn" id="likeBtn"><span class="material-icons">favorite_border</span></button>
            <button class="player-btn player-btn-play" id="playPauseBtn"><span class="material-icons">play_arrow</span></button>
        </div>
        <input type="range" class="progress-bar" id="progressBarBottom" min="0" max="100" value="0">
    </div>

    <nav class="bottom-nav">
        <div class="nav-item active" data-page="home">
            <span class="material-icons">home</span>
            <span>Inicio</span>
        </div>
        <div class="nav-item" data-page="search">
            <span class="material-icons">search</span>
            <span>Buscar</span>
        </div>
        <div class="nav-item">
            <span class="material-icons">library_music</span>
            <span>Biblioteca</span>
        </div>
    </nav>

    <script>
const state = {
    allContent: [],
    allSections: [],
    isPlaying: false,
    isLiked: false,
    currentFilter: null,
    colorCache: new Map()
};

const els = {
    navPills: document.getElementById('navPills'),
    sectionsContainer: document.getElementById('sectionsContainer'),
    playerBar: document.getElementById('playerBar'),
    playerBarSpacing: document.getElementById('playerBarSpacing')
};

// Event Listeners
document.querySelectorAll('.nav-item[data-page]').forEach(item => {
    item.addEventListener('click', () => {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(item.dataset.page).classList.add('active');
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        item.classList.add('active');
    });
});

document.getElementById('likeBtn').addEventListener('click', () => {
    state.isLiked = !state.isLiked;
    document.getElementById('likeBtn').querySelector('.material-icons').textContent = state.isLiked ? 'favorite' : 'favorite_border';
});

[document.getElementById('playPauseBtn'), document.getElementById('playBtnLarge'), document.getElementById('playBtnLarge2')].forEach(btn => {
    btn.addEventListener('click', togglePlayPause);
});

els.playerBar.addEventListener('click', e => {
    if (!e.target.closest('button') && !e.target.classList.contains('progress-bar')) {
        showPage('nowPlaying');
        document.body.classList.add('now-playing-open');
    }
});

[document.getElementById('progressBar'), document.getElementById('progressBarBottom')].forEach(bar => {
    bar.addEventListener('input', e => {
        e.target.style.background = `linear-gradient(to right, #fff ${e.target.value}%, rgba(255,255,255,0.35) ${e.target.value}%)`;
    });
});

// Utility Functions
const showPage = id => {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById(id).classList.add('active');
};

function togglePlayPause() {
    state.isPlaying = !state.isPlaying;
    const icon = state.isPlaying ? 'pause' : 'play_arrow';
    ['playPauseBtn', 'playBtnLarge', 'playBtnLarge2'].forEach(id => {
        document.getElementById(id).querySelector('.material-icons').textContent = icon;
    });
}

const getImageUrl = item => item?.thumbnails?.[0]?.url || '';

const isVideoContent = item => {
    if (!item) return false;
    const url = getImageUrl(item);
    if (url?.includes('ytimg.com')) {
        const t = item.thumbnails?.[0];
        return t?.width && t?.height ? t.width / t.height > 1.5 : false;
    }
    return false;
};

const isPlaylist = item => {
    if (!item) return false;
    if (item.endpoint?.name === 'browseEndpoint') return true;
    if (item.endpoint?.name === 'watchEndpoint') return false;
    return item.videoId && (item.videoId.startsWith('VL') || item.videoId.startsWith('RDCLAK') || item.videoId.startsWith('MPREb'));
};

function getDominantColor(url, cb) {
    if (!url) return cb('rgb(94,37,99)');
    if (state.colorCache.has(url)) return cb(state.colorCache.get(url));
    
    const img = new Image();
    img.crossOrigin = 'Anonymous';
    img.src = url;
    
    img.onload = () => {
        try {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = canvas.height = 20;
            ctx.drawImage(img, 0, 0, 20, 20);
            
            const data = ctx.getImageData(0, 0, 20, 20).data;
            const colorMap = {};
            
            for (let i = 0; i < data.length; i += 16) {
                const [r, g, b, a] = [data[i], data[i+1], data[i+2], data[i+3]];
                if (a < 125) continue;
                
                const brightness = (r * 299 + g * 587 + b * 114) / 1000;
                if (brightness > 250 || brightness < 10) continue;
                
                const saturation = Math.max(r, g, b) - Math.min(r, g, b);
                if (saturation < 15) continue;
                
                const key = `${Math.floor(r/30)*30},${Math.floor(g/30)*30},${Math.floor(b/30)*30}`;
                colorMap[key] = (colorMap[key] || 0) + 1;
            }
            
            let maxCount = 0, dominantColor = '94,37,99';
            for (const color in colorMap) {
                if (colorMap[color] > maxCount) {
                    maxCount = colorMap[color];
                    dominantColor = color;
                }
            }
            
            const result = `rgb(${dominantColor})`;
            state.colorCache.set(url, result);
            cb(result);
        } catch {
            const fallback = 'rgb(94,37,99)';
            state.colorCache.set(url, fallback);
            cb(fallback);
        }
    };
    
    img.onerror = () => {
        const fallback = 'rgb(94,37,99)';
        state.colorCache.set(url, fallback);
        cb(fallback);
    };
}

// API Functions
async function loadAllSections(filter = null) {
    try {
        state.currentFilter = filter;
        const url = filter ? `https://braided-music-1--privateclooud.replit.app/home?filter=${encodeURIComponent(filter)}` : 'https://braided-music-1--privateclooud.replit.app/home';
        const data = await (await fetch(url)).json();
        
        if (data.header?.chips) renderChips(data.header.chips);
        if (data.sections) {
            state.allSections = data.sections.filter(s => s.items?.length > 0);
            renderAllSections();
        }
    } catch (e) {
        console.error('Error:', e);
    }
}

function renderChips(chips) {
    const profile = els.navPills.querySelector('.profile-icon');
    els.navPills.innerHTML = '';
    els.navPills.appendChild(profile);
    
    const createPill = (text, filterValue) => {
        const btn = document.createElement('button');
        btn.className = 'pill';
        if (state.currentFilter === filterValue) btn.classList.add('active');
        btn.textContent = text;
        btn.onclick = () => loadAllSections(filterValue);
        return btn;
    };
    
    els.navPills.appendChild(createPill('Todas', null));
    chips.forEach(chip => els.navPills.appendChild(createPill(chip.text, chip.text)));
}

function renderAllSections() {
    els.sectionsContainer.innerHTML = '';
    state.allContent = [];
    
    state.allSections.forEach((section, idx) => {
        const div = document.createElement('div');
        div.className = 'section';
        
        if (idx === 0) {
            div.innerHTML = `<h1 class="main-title">${section.title}</h1><div class="songs-list" id="section-${idx}"></div>`;
            els.sectionsContainer.appendChild(div);
            const start = state.allContent.length;
            state.allContent.push(...section.items);
            renderSongs(section.items.slice(0, 3), `section-${idx}`, start);
        } else {
            div.innerHTML = `<h2 class="section-title">${section.title}</h2><div class="playlists-container" id="section-${idx}"></div>`;
            els.sectionsContainer.appendChild(div);
            const start = state.allContent.length;
            state.allContent.push(...section.items);
            renderPlaylists(section.items, `section-${idx}`, start, idx);
        }
    });
}

function renderSongs(items, containerId, startIndex) {
    const container = document.getElementById(containerId);
    if (!container) return;
    
    items.forEach((item, i) => {
        const div = document.createElement('div');
        div.className = 'song-item';
        div.onclick = () => playSong(startIndex + i);
        div.innerHTML = `
            <div class="song-cover" style="background-image: url('${getImageUrl(item)}')"></div>
            <div class="song-info">
                <div class="song-title">${item.title || 'Sin título'}</div>
                <div class="song-artist">${item.artist || 'Artista desconocido'}</div>
            </div>
        `;
        container.appendChild(div);
    });
}

function renderPlaylists(items, containerId, startIndex, sectionIndex) {
    const container = document.getElementById(containerId);
    if (!container) return;
    
    items.forEach((item, i) => {
        const url = getImageUrl(item);
        const isVideo = isVideoContent(item);
        const itemIsPlaylist = isPlaylist(item);
        
        const card = document.createElement('div');
        card.className = `playlist-card${isVideo ? ' video-card' : ''}`;
        card.onclick = () => itemIsPlaylist ? openPlaylist(sectionIndex, i) : playSong(startIndex + i);
        card.innerHTML = `
            <div class="playlist-cover${isVideo ? ' video-thumbnail' : ''}" style="background-image: url('${url}')"></div>
            <div class="playlist-title">${item.title || 'Sin título'}</div>
            <div class="playlist-artists">${item.artist || 'Artista desconocido'}</div>
        `;
        container.appendChild(card);
    });
}

function openPlaylist(sectionIndex, itemIndex) {
    const item = state.allSections[sectionIndex]?.items[itemIndex];
    if (!item) return;
    
    showPage('playlistView');
    
    const url = getImageUrl(item);
    document.getElementById('plCover').style.backgroundImage = `url('${url}')`;
    
    if (url) {
        getDominantColor(url, color => {
            const gradient = document.querySelector('#playlistView .playlist-gradient');
            if (gradient) gradient.style.background = `linear-gradient(to bottom, ${color} 0%, #000 100%)`;
        });
    }
    
    document.getElementById('plTitle').textContent = item.title || 'Sin título';
    document.getElementById('plArtist').textContent = item.artist || 'Sin descripción';
    document.getElementById('playlistSongs').innerHTML = '';
}

function playSong(i) {
    const item = state.allContent[i];
    if (!item || isPlaylist(item)) return;
    
    state.isPlaying = true;
    togglePlayPause();
    
    const url = getImageUrl(item);
    
    ['playerCover', 'npCover'].forEach(id => {
        document.getElementById(id).style.backgroundImage = `url('${url}')`;
    });
    
    if (url) {
        getDominantColor(url, color => {
            els.playerBar.style.background = color;
            document.getElementById('nowPlaying').style.background = color;
        });
    }
    
    ['playerTitle', 'npTitle'].forEach(id => document.getElementById(id).textContent = item.title || 'Sin título');
    ['playerArtist', 'npArtist'].forEach(id => document.getElementById(id).textContent = item.artist || 'Artista desconocido');
    
    els.playerBar.classList.add('active');
    els.playerBarSpacing.classList.add('active');
    document.body.classList.add('playing', 'now-playing-open');
    showPage('nowPlaying');
}

window.closePlaylistView = () => showPage('home');
window.closeNowPlaying = () => {
    showPage('home');
    document.body.classList.remove('now-playing-open');
};

loadAllSections();
    </script>
</body>
</html>
