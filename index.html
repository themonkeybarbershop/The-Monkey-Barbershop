<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="container">
    <nav class="nav-pills">
        <div class="profile-icon">S</div>
        <button class="pill green">Todas</button>
        <button class="pill">Música</button>
        <button class="pill">Podcasts</button>
    </nav>
    <section>
        <p class="subtitle">Explora una sesión basada en tus gustos musicales</p>
        <h1 class="main-title">Escuchar ahora</h1>
    </section>
    <section class="songs-list" id="songsList"></section>
    <section class="rhythm-section">
        <h2 class="section-title">Sugerencias para hoy</h2>
        <div class="playlists-container" id="playlistsContainer"></div>
    </section>
</div>
<nav class="bottom-nav">
    <div class="nav-item active" onclick="window.location.href='index.html'">
        <span class="material-icons">home</span>
        <span>Inicio</span>
    </div>
    <div class="nav-item" onclick="window.location.href='buscar.html'">
        <span class="material-icons">search</span>
        <span>Buscar</span>
    </div>
    <div class="nav-item">
        <span class="material-icons">library_music</span>
        <span>Tu biblioteca</span>
    </div>
    <div class="nav-item">
        <span class="material-icons">add_circle_outline</span>
        <span>Crear</span>
    </div>
</nav>
<script>
async function fetchMusicData() {
    const response = await fetch('https://itunes.apple.com/mx/rss/topsongs/limit=200/json');
    const data = await response.json();
    if (!data.feed?.entry) return;
    const normalized = data.feed.entry.map(item => ({
        trackName: item['im:name'].label,
        artistName: item['im:artist'].label,
        artwork: item['im:image'][2].label.replace(/100x100bb\.jpg$/, '3000x3000bb.jpg').replace(/\d+x\d+bb\.jpg$/, '3000x3000bb.jpg'),
        explicit: item['im:contentRating']?.label === 'Explicit'
    }));
    const shuffled = normalized.sort(() => Math.random() - 0.5);
    displaySongs(shuffled.slice(0, 3));
    displayPlaylists(shuffled.slice(3));
}
function displaySongs(items) {
    const container = document.getElementById('songsList');
    container.innerHTML = '';
    items.forEach(item => {
        const div = document.createElement('div');
        div.className = 'song-item';
        div.innerHTML = `
            <div class="song-cover" style="background-image:url('${item.artwork}')"></div>
            <div class="song-info">
                <div class="song-title">${item.trackName}</div>
                <div class="song-artist">
                    ${item.explicit ? '<span class="explicit-badge">E</span>' : ''}
                    ${item.artistName}
                </div>
            </div>
            <button class="more-btn">
                <span class="material-icons">more_horiz</span>
            </button>
        `;
        container.appendChild(div);
    });
}
function displayPlaylists(items) {
    const container = document.getElementById('playlistsContainer');
    container.innerHTML = '';
    items.forEach(item => {
        const card = document.createElement('div');
        card.className = 'playlist-card';
        card.innerHTML = `
            <div class="playlist-cover" style="background-image:url('${item.artwork}')"></div>
            <div class="playlist-title">${item.trackName}</div>
            <div class="playlist-artists">${item.artistName}</div>
        `;
        container.appendChild(card);
    });
}
fetchMusicData();
</script>
</body>
</html>
